name: Publish release

on:
  push:
    tags:
    - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup SourcePawn Compiler
      id: setup
      uses: rumblefrog/setup-sp@v1.1.0
      with:
        version: "1.10.x"

    - name: Create plugins directory
      run: mkdir addons/sourcemod/plugins

    - name: Compile plugins
      run: |
        cd addons/sourcemod/scripting
        for file in *.sp; do spcomp $file -i "include" -o "../plugins/${file%.*}.smx"; done;

    - name: Compress plugins
      run : |
        mkdir build
        zip -r "build/movementhud-${{ github.ref_name }}.zip" addons

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/movementhud-${{ github.ref_name }}.zip
          addons/sourcemod/plugins/movementhud.smx
